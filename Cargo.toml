[package]
name = "unaligned-pow"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Equi-X proof of work for signup and login forms: server-side verify, browser solver (WebAssembly)"
repository = "https://github.com/UnalignedSA/pow"
publish = false

[lib]
# rlib for a server (verify), cdylib for the browser build (wasm32).
crate-type = ["rlib", "cdylib"]

[dependencies]
sha2 = "0.11.1"

# Native: HashX programs are compiled to machine code. WebAssembly can't do
# that, so the browser build interprets them.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
equix = "0.8.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
equix = { version = "0.8.0", default-features = false }

# Browser solver build (see build-wasm.sh).
[profile.wasm]
inherits = "release"
# Arithmetic overflow stops the solver instead of wrapping around.
overflow-checks = true
lto = true
codegen-units = 1
panic = "abort"
# Served to every visitor: no symbols, no build paths.
strip = true
